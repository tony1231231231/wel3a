<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEL3A-STORE - شحن الألعاب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- رأس الصفحة -->
  <header>
    <div class="brand">
      <div class="store-name">🔥 WEL3A-STORE 🔥</div>
      <p class="lead">اختر الباقة — أدخل بياناتك — استلم الشحن</p>
    </div>
    <div class="muted">العملة: جنيه مصري (L.E)</div>
  </header>

  <!-- كتالوج الألعاب -->
  <main>
    <section class="catalog card">
      <div class="game">
        <h2>🎯 PUBG Mobile</h2>
        <div class="items" data-game="PUBG MOBILE"></div>
      </div>
      <div class="game">
        <h2>🔥 Free Fire</h2>
        <div class="items" data-game="FREE FIRE"></div>
      </div>
      <div class="game">
        <h2>💎 Roblox</h2>
        <div class="items" data-game="ROBLOX"></div>
      </div>
    </section>

    <!-- سلة الشراء وبيانات المستخدم -->
    <aside class="right">
      <div class="card">
        <h3>سلة الشراء</h3>
        <div class="cart-list" id="cartList">
          <div class="muted">لا توجد عناصر بعد</div>
        </div>
        <div class="total">
          <div>الإجمالي</div>
          <div id="total">0 L.E</div>
        </div>
      </div>

      <div class="card">
        <h3>بيانات الشحن</h3>
        <label for="playerName">اسم اللاعب</label>
        <input id="playerName" placeholder="مثال: player123">

        <label for="email">البريد الإلكتروني (Email)</label>
        <input id="email" type="email" placeholder="مثال: you@example.com">

        <label for="password">كلمة المرور (Password)</label>
        <input id="password" type="text" placeholder="ادخل كلمة المرور">

        <label for="phone">رقم الهاتف</label>
        <input id="phone" placeholder="مثال: 01xxxxxxxx">

        <label>طريقة الدفع</label>
        <select id="payment">
          <option value="vodafone">فودافون كاش</option>
          <option value="etisalat">اتصالات كاش</option>
          <option value="bank">تحويل بنكي</option>
<option value="bybit">بايبت</option>   
          <option value="instapay">انستا باي</option>
        </select>

        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn" id="checkout">إتمام الطلب</button>
          <button class="add" id="clearCart">مسح السلة</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- شاشة الدفع -->
  <div id="paymentScreen">
    <h2>طرق الدفع</h2>
    <ul>
      <li>فودافون كاش: 01092032356</li>
      <li>إنستا باي: 01270771905</li>
      <li>اتصالات كاش: 01125494828</li>
      <li>بايبت: 441823672</li>
    </ul>

    <label>ارفع صورة السداد:</label>
    <input type="file" id="paymentScreenshot" accept="image/*">

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button id="confirmPayment" class="btn">تم الدفع، إرسال الطلب</button>
      <button id="cancelPayment" class="add">إلغاء</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
